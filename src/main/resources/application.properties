spring.application.name=levelup-backend
server.port=8080

# Lee la contraseña de MySQL desde local.properties (en la raíz del proyecto).
# Ese archivo está en .gitignore, así cada integrante usa su propia clave y no se sube a GitHub.
spring.config.import=optional:file:./local.properties

# ===== Conexión a MySQL =====
# createDatabaseIfNotExist crea la base levelup_db la primera vez que se levanta el proyecto.
spring.datasource.url=jdbc:mysql://localhost:3306/levelup_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
# DB_PASSWORD se define en local.properties (o como variable de entorno).
# No lleva valor por defecto para no dejar una contraseña real en un archivo que se sube a GitHub;
# si falta, la aplicación no arranca y el error indica que no encontró DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
# update: crea y actualiza las tablas a partir de las clases @Entity, sin borrar los datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
